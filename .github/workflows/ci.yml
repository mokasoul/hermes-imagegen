name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest tests -q
      - name: Desktop half syntax
        run: |
          cp desktop/plugin.js /tmp/plugin-check.mjs
          node --check /tmp/plugin-check.mjs
      - name: Panel stylesheet is up to date
        run: |
          python scripts/build_panel_css.py
          git diff --exit-code desktop/panel.css
          if grep -q "dsw-alias" desktop/panel.css; then
            echo "panel.css still references DSH tokens" >&2
            exit 1
          fi
          python - <<'PY'
          import pathlib
          text = pathlib.Path("desktop/panel.css").read_text()
          assert text.count("{") == text.count("}"), "unbalanced braces in panel.css"
          rules = [line for line in text.splitlines() if line.startswith(".")]
          assert rules and all(line.startswith(".ig-root") for line in rules), "unscoped selector in panel.css"
          print(f"panel.css ok: {len(rules)} scoped rules")
          PY
      - name: Manifest sanity
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          manifest = json.loads((root / "dashboard/manifest.json").read_text())
          assert manifest["api"] == "plugin_api.py"
          assert (root / "dashboard/plugin_api.py").exists()
          assert (root / "__init__.py").exists()
          yaml_text = (root / "plugin.yaml").read_text()
          assert re.search(r"^name:\s*hermes-imagegen$", yaml_text, re.M)
          assert re.search(r"^kind:\s*standalone$", yaml_text, re.M)
          print("manifest ok")
          PY
