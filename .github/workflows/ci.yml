name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest tests -q
      - name: Desktop half syntax
        run: |
          cp desktop/plugin.js /tmp/plugin-check.mjs
          node --check /tmp/plugin-check.mjs
      - name: Result layout table
        run: node scripts/check_result_layout.mjs
      - name: Stylesheets are up to date
        run: |
          python scripts/build_panel_css.py
          git diff --exit-code desktop/panel.css desktop/panel-results.css desktop/panel-menu.css desktop/panel-loading.css
          if grep -q "dsw-alias" desktop/panel*.css; then
            echo "a generated sheet still references DSH tokens" >&2
            exit 1
          fi
          python - <<'PY'
          import pathlib
          # Each generated sheet must stay scoped under the surface root it owns;
          # the roots are distinct because upstream class names collide (both
          # panel.module.css and studio-results.module.css define .card).
          roots = {
              "panel.css": ".ig-root",
              "panel-results.css": ".ig-results",
              "panel-menu.css": ".ig-menu",
              "panel-loading.css": ".ig-loading",
          }
          for name, root in roots.items():
              text = pathlib.Path("desktop", name).read_text()
              assert text.count("{") == text.count("}"), f"unbalanced braces in {name}"
              rules = [line for line in text.splitlines() if line.startswith(".")]
              assert rules, f"no rules in {name}"
              bad = [line for line in rules if not line.startswith(root)]
              assert not bad, f"unscoped selector in {name}: {bad[:3]}"
              print(f"{name} ok: {len(rules)} rules under {root}")
          PY
      - name: Utility stylesheet covers every class plugin.js uses
        run: |
          python scripts/build_plugin_ui_css.py
          git diff --exit-code desktop/plugin-ui.css
          python - <<'PY'
          import pathlib
          text = pathlib.Path("desktop/plugin-ui.css").read_text()
          assert text.count("{") == text.count("}"), "unbalanced braces in plugin-ui.css"
          print(f"plugin-ui.css ok: {text.count('{')} rules")
          PY
      - name: Manifest sanity
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path(".")
          manifest = json.loads((root / "dashboard/manifest.json").read_text())
          assert manifest["api"] == "plugin_api.py"
          assert (root / "dashboard/plugin_api.py").exists()
          assert (root / "__init__.py").exists()
          yaml_text = (root / "plugin.yaml").read_text()
          assert re.search(r"^name:\s*hermes-imagegen$", yaml_text, re.M)
          assert re.search(r"^kind:\s*standalone$", yaml_text, re.M)
          print("manifest ok")
          PY
