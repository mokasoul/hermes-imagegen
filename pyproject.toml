[project]
name = "hermes-imagegen"
version = "0.10.0"
description = "AI image generation workbench plugin for Hermes (port of dickpy/dsh-imagegen)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["imagegen_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
